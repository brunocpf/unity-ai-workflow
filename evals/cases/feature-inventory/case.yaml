schema_version: "1.0"
name: feature-inventory
description: Gameplay feature + UI in an existing small project (feature/UI skill should fire).
tags: [fire, feature, ui]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add an inventory to this game: the player picks up items by walking into them, items of the same type stack up to 99 per stack, and a UI Toolkit list on screen shows each item with its count.
    Unity is not installed in this environment, so write the project files directly; I'll open the project in Unity 6 later. Don't ask me questions — make reasonable choices and note them at the end.
  max_turns: 70
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
runs: 3
graders:
  - name: has-tests
    type: file_exists
    path: "**/*Test*.cs"
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: feature-quality
    type: llm
    focus: trace
    weight: 3
    criteria: |
      Evidence is the run trace: grade only content the agent itself wrote (Write/Edit inputs, or files created via Bash). Ignore documentation or examples it merely read, and don't credit claims in its final message that the written files don't back up.
      Judge the code the agent added to the existing Skyforge project. Pass only if ALL of these hold:
      1. All requested behavior is implemented: pickup on contact, stacking capped at 99 per stack (overflow handled sensibly, e.g. a new stack), and a UI Toolkit list showing item and count that updates when the inventory changes.
      2. The inventory/stacking rules live in a plain C# type with no UnityEngine dependency, so they can be unit tested without the engine.
      3. The UI gets its data through a view model/presenter or an observable state object, not by reaching into gameplay MonoBehaviours or polling them every frame.
      4. Unit tests cover the 99 cap/overflow and adding a different item type.
      5. Event subscriptions are released (OnDisable/OnDestroy/Dispose), and the code fits the existing project (Skyforge namespaces, Assets/Scripts layout, assembly references updated where needed).
      Fail if any item is missing or clearly broken.
