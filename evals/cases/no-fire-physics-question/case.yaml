schema_version: "1.0"
name: no-fire-physics-question
description: A general Unity question; the workflow should not take over or create files.
tags: [no-fire]
execution:
  prompt: |
    Quick Unity question: when should physics code go in FixedUpdate instead of Update? A short answer is fine.
  max_turns: 5
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    min: 0
    max: 0
  - name: mentions-fixedupdate
    type: regex
    pattern: 'FixedUpdate'
    weight: 0.5
  - name: answer-quality
    type: llm
    weight: 2
    criteria: |
      Pass only if the answer is correct and concise (roughly 250 words or fewer): physics forces/Rigidbody movement go in FixedUpdate because it runs on the fixed physics timestep; input reading and per-frame visuals go in Update (input captured in Update and applied in FixedUpdate). It must not drift into project setup, architecture advice, or unrelated workflow instructions.
