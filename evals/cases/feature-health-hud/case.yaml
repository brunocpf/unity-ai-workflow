schema_version: "1.0"
name: feature-health-hud
description: Game UI work in an existing small project (UI skill should fire).
tags: [fire, ui]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add a health bar HUD using UI Toolkit that shows the player's current and max health and gives clear visual feedback when the player takes damage. It should look like it belongs in a polished game, not a debug overlay.
    Unity is not installed in this environment, so write the project files directly; I'll open the project in Unity 6 later. Don't ask me questions — make reasonable choices and note them at the end.
  max_turns: 70
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
runs: 3
graders:
  - name: has-tests
    type: file_exists
    path: "**/*Test*.cs"
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: has-uxml
    type: file_exists
    path: "**/*.uxml"
    weight: 0.5
  - name: has-uss
    type: file_exists
    path: "**/*.uss"
    weight: 0.5
  - name: hud-quality
    type: llm
    focus: trace
    weight: 3
    criteria: |
      Evidence is the run trace: grade only content the agent itself wrote (Write/Edit inputs, or files created via Bash). Ignore documentation or examples it merely read, and don't credit claims in its final message that the written files don't back up.
      Judge the UI code and assets the agent added to the existing Skyforge project. Pass only if ALL of these hold:
      1. The HUD shows current and max health and reacts to damage with visible feedback (e.g. animated fill, flash, delayed "ghost" bar), driven by a change notification from the player rather than polling every frame.
      2. Display logic (fill ratio, low-health state, text) lives in a view model or presenter that can be unit tested without the engine, and there is at least one such test.
      3. Layout is in UXML and styling in USS (not built entirely in C# with inline styles), and the styling is deliberate: custom colors/shapes/typography, not default Unity controls.
      4. Subscriptions are released when the HUD or player is disabled/destroyed.
      5. It integrates with the existing PlayerController (TakeDamage/Health) without breaking its current behavior, and assembly references are updated where needed.
      Fail if any item is missing or clearly broken.
