schema_version: "1.0"
name: feature-save-load
description: Persistence feature in an existing small project (feature skill should fire).
tags: [fire, feature, persistence]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Add saving and loading of the player's progress (level reached, gold, and a set of unlocked abilities) to disk so it survives restarting the game. This will ship to players and we'll keep adding fields in future updates.
    Unity is not installed in this environment, so write the project files directly; I'll open the project in Unity 6 later. Don't ask me questions — make reasonable choices and note them at the end.
  max_turns: 70
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
runs: 3
graders:
  - name: has-tests
    type: file_exists
    path: "**/*Test*.cs"
  - name: skill-fired
    type: tool_used
    tool: Skill
    min: 1
  - name: persistence-quality
    type: llm
    focus: trace
    weight: 3
    criteria: |
      Evidence is the run trace: grade only content the agent itself wrote (Write/Edit inputs, or files created via Bash). Ignore documentation or examples it merely read, and don't credit claims in its final message that the written files don't back up.
      Judge the code the agent added to the existing Skyforge project. Pass only if ALL of these hold:
      1. Level, gold and unlocked abilities are saved and restored (loaded on startup or via a clear entry point wired into the game).
      2. The save format carries a schema version and there is a path for migrating older versions forward.
      3. A missing or corrupt save file does not crash the game: it falls back to defaults (and ideally preserves/reports the bad file) rather than throwing unhandled.
      4. Writes are safe against interruption (write to a temp file then replace/rename, or equivalent).
      5. Serialization/migration logic is separable from file IO and covered by unit tests (round trip, and corrupt or old-version input).
      Fail if any item is missing or clearly broken.
